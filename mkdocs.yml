site_name: DocLens
site_description: Plataforma de gestión de casos legales e IA multi-tenant sobre AWS Serverless
site_url: https://cincuentaydos.github.io/DocLens.Docs
repo_url: https://github.com/cincuentaydos/DocLens.Docs
repo_name: cincuentaydos/DocLens.Docs
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.action.edit
  logo: assets/logo.png
  favicon: assets/logo.png
  language: es
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Resumen: overview.md
  - Arquitectura: architecture.md
  - Flujo de Datos: data-flow.md
  - Referencia de API: api-reference.md
  - Alta de Tenants: tenant-onboarding.md
  - ADRs:
    - ADR-001 — Estrategia de RAG: adrs/001-rag-strategy.md
    - ADR-002 — Estrategia de IaC: adrs/002-iac-strategy.md
    - ADR-003 — Estrategia de Extracción de Texto: adrs/003-ocr-strategy.md
    - ADR-004 — Escaneo de Malware: adrs/004-malware-scanning.md
    - ADR-005 — Estrategia de Subida: adrs/005-upload-strategy.md
    - ADR-006 — Procesamiento Síncrono vs Asíncrono: adrs/006-sync-vs-async-processing.md
    - ADR-007 — Versionado de Documentos: adrs/007-document-versioning.md
    - ADR-008 — Estrategia de Almacenamiento de Datos: adrs/008-data-storage-strategy.md
    - ADR-009 — Estrategia de Red y Edge: adrs/009-edge-network-strategy.md
    - ADR-010 — Estrategia de Cómputo: adrs/010-compute-strategy.md
    - ADR-011 — Disparo del Procesamiento de Documentos: adrs/011-document-processing-trigger.md
    - ADR-012 — Sin Agente Autónomo: adrs/012-no-autonomous-agent.md
    - ADR-013 — Recuperación ante Desastres: adrs/013-disaster-recovery-strategy.md
    - Comparación de IaC (CDK vs Terraform): adrs/iac-comparison.md
  - Proyectos:
    - DocLens.Lambda: projects/lambda.md
    - DocLens.Web.Template: projects/web-template.md
    - DocLens.Skills: projects/skills.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cincuentaydos
